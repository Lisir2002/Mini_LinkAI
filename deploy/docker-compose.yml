name: ai-chatroom

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: aicr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
    command: >
      postgres -c max_connections=100
               -c log_min_duration_statement=500
               -c shared_buffers=128MB
               -c effective_cache_size=256MB
               -c idle_in_transaction_session_timeout=60000
               -c statement_timeout=60000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 512M }

  redis:
    image: redis:7.2-alpine
    container_name: aicr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb",
              "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 160M }

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: aicr-app
    restart: unless-stopped
    env_file: ../.env
    environment:
      TZ: UTC
      ROLE: web
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers"
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/api/health',timeout=3).status_code==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 640M }

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: aicr-scheduler
    restart: unless-stopped
    env_file: ../.env
    environment:
      TZ: UTC
      ROLE: scheduler
    depends_on:
      app: { condition: service_healthy }
    command: ["python", "-m", "app.stats.scheduler"]
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 192M }
      replicas: 1

  caddy:
    image: caddy:2.8-alpine
    container_name: aicr-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
      - ../frontend/dist:/srv:ro
    depends_on:
      app: { condition: service_healthy }
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:

networks:
  internal:
    driver: bridge
