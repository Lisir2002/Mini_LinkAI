name: ai-chatroom-dev
services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_chatroom
      POSTGRES_USER: ai_chatroom
      POSTGRES_PASSWORD: devpassword
      TZ: UTC
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdev:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_chatroom -d ai_chatroom"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "devpassword"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdev:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devpassword", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  pgdev:
  redisdev:
