[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]          # FastAPI Depends() 默认值写法

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
plugins = []
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]   # 迁移内嵌 PRD 原文 DDL，保持逐字一致，不折行
